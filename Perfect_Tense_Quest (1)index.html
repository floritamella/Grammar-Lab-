<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Tense Quest</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--primary:#5b5bd6;--primary2:#7b61ff;--good:#18864b;--bad:#c73b3b;--warn:#b7791f;--line:#e5e7eb;--soft:#eef0ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}h1,h2,h3{margin:0 0 8px}.subtitle{color:var(--muted)}
.badge{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:999px;font-weight:700}.progress-wrap{background:#e9ebf2;border-radius:999px;height:10px;margin:10px 0 24px;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:14%;transition:.3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 8px 25px #1822300b;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tense{border:2px solid var(--line);border-radius:16px;padding:18px;transition:.2s}.tense:hover{transform:translateY(-2px);border-color:var(--primary)}.tense.selected{border-color:var(--primary);background:var(--soft)}
.formula{font-size:1.1rem;font-weight:800;background:#f7f7fb;padding:12px;border-radius:12px;margin:12px 0}.timeline{margin:16px 0;padding:14px;border-radius:14px;background:#fafafa}.line{height:4px;background:#bbb;border-radius:4px;margin:12px 0;position:relative}.dot{position:absolute;width:14px;height:14px;background:var(--primary);border-radius:50%;top:-5px}.activity{position:absolute;left:5%;right:8%;height:12px;top:-4px;background:#b8b8ff;border-radius:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{padding:7px 10px;border-radius:999px;background:#f0f2f5;color:#475467;font-size:.9rem}button{border:0;border-radius:12px;padding:11px 16px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--primary);color:white}button.secondary{background:#eef0f4;color:#344054}button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.choice-grid{display:grid;gap:12px;margin:18px 0}.choice{background:white;color:var(--ink);border:2px solid var(--line);text-align:left}.choice:hover{border-color:var(--primary)}.choice.correct{border-color:var(--good);background:#ecfdf3}.choice.wrong{border-color:var(--bad);background:#fff1f2}
.feedback{padding:14px;border-radius:14px;margin-top:14px;background:#f5f5f5}.feedback.good{background:#ecfdf3;color:#126b3c}.feedback.bad{background:#fff1f2;color:#a62d2d}.dialogue{display:flex;flex-direction:column;gap:10px;margin:18px 0}.bubble{max-width:78%;padding:13px 16px;border-radius:16px;background:#f1f3f7}.bubble.you{align-self:flex-end;background:var(--soft)}.blank{display:inline-block;border-bottom:3px solid var(--primary);min-width:150px;color:var(--primary);font-weight:800}
.score{font-size:1.5rem;font-weight:800}.small{font-size:.9rem;color:var(--muted)}input.answer{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:1rem}textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit}.reflection label{display:block;font-weight:700;margin:18px 0 7px}.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr}.app{padding:14px}.card{padding:18px}.bubble{max-width:90%}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Perfect Tense Quest</h1><div class="subtitle">Present Perfect Simple &amp; Present Perfect Continuous</div></div><div class="badge">⭐ <span id="score">0</span> pts</div></header>
<div class="progress-wrap"><div class="progress" id="progress"></div></div><main id="app"></main>
</div>
<script>
const stages=["Understand","Choose","Build","Speak","Complete","Check","Reflect"];
let stage=0,score=0,answered=false;
const data={
 choose:[
  {text:"Sarah has cleaned her room. Look! Everything is tidy.",q:"Why do we use Present Perfect Simple?",opts:["We focus on the result.","We focus on how long Sarah has been cleaning.","The activity is happening every day."],ans:0,why:"The important point is the present result: the room is clean."},
  {text:"Tom started studying two hours ago. He is still studying.",q:"Which sentence best describes the situation?",opts:["Tom has studied for two hours.","Tom has been studying for two hours.","Tom is studying for two hours."],ans:1,why:"The activity started in the past and continues now, with focus on duration."},
  {text:"Mia has visited Bali three times.",q:"What is the speaker focusing on?",opts:["The number of experiences.","The activity happening right now.","The exact duration of one visit."],ans:0,why:"Present Perfect Simple often focuses on experiences or how many times something happened."},
  {text:"Look at Daniel! His hands are covered in paint.",q:"Which sentence best highlights the recent activity?",opts:["Daniel has painted the wall.","Daniel has been painting the wall.","Daniel paints the wall every week."],ans:1,why:"The visible evidence points to a recent activity, so Present Perfect Continuous fits well."}
 ],
 build:[
  {context:"Tom started studying two hours ago. He is still studying.",parts:["Tom","has","been","studying","for","two hours."],answer:"Tom has been studying for two hours."},
  {context:"Lina finished her homework. The homework is complete now.",parts:["Lina","has","finished","her","homework."],answer:"Lina has finished her homework."}
 ],
 complete:[
  {a:"Why are you so tired?",b:"I ______ (study) for three hours.",answer:"have been studying",why:"The activity started in the past and continued for a duration."},
  {a:"Do you want to watch the movie?",b:"No, I ______ (watch) it already.",answer:"have watched",why:"The completed experience/result is important; 'already' is a common signal."},
  {a:"How long has Maya worked here?",b:"She ______ (work) here since 7 a.m.",answer:"has been working",why:"The activity has continued from a starting point until now."},
  {a:"Is your project ready?",b:"Yes, I ______ (finish) it.",answer:"have finished",why:"The focus is on the completed result: the project is ready."}
 ]
};
function update(){document.getElementById('score').textContent=score;document.getElementById('progress').style.width=((stage+1)/stages.length*100)+'%';}
function title(h,d){return `<div class="card"><div class="small">LEVEL ${stage+1} — ${stages[stage].toUpperCase()}</div><h2>${h}</h2><p>${d}</p></div>`}
function buttons(back=true){return `<div class="actions">${back?'<button class="secondary" onclick="go(-1)">← Back</button>':'<span></span>'}<button onclick="go(1)">Next →</button></div>`}
function go(n){stage=Math.max(0,Math.min(6,stage+n));render()}
function render(){update();answered=false;const el=document.getElementById('app');if(stage===0)understand(el);if(stage===1)choose(el);if(stage===2)build(el);if(stage===3)speak(el);if(stage===4)complete(el);if(stage===5)check(el);if(stage===6)reflect(el)}
function understand(el){el.innerHTML=title('Understand the Concept','First, notice the meaning. Do we focus on a result, or an activity/duration?')+`<div class="grid">
<div class="tense selected"><h3>Present Perfect Simple</h3><div class="formula">have / has + V3</div><p><b>Use it for:</b> results, experiences, achievements, and completed actions connected to now.</p><div class="timeline"><b>PAST ───── ● ACTION ───── NOW</b><div class="line"><span class="dot" style="left:48%"></span></div><b>↳ RESULT / CONNECTION</b></div><div class="tags"><span class="tag">already</span><span class="tag">yet</span><span class="tag">ever</span><span class="tag">never</span><span class="tag">just</span><span class="tag">three times</span></div><p><b>Example:</b> I have finished my homework.</p></div>
<div class="tense"><h3>Present Perfect Continuous</h3><div class="formula">have / has + been + V-ing</div><p><b>Use it for:</b> activities continuing until now, recent activity, duration, and visible evidence.</p><div class="timeline"><b>PAST ━━━━━ ACTIVITY ━━━━━ NOW</b><div class="line"><span class="activity"></span></div><b>↳ ACTIVITY / DURATION</b></div><div class="tags"><span class="tag">for</span><span class="tag">since</span><span class="tag">all day</span><span class="tag">recently</span><span class="tag">lately</span></div><p><b>Example:</b> I have been studying for two hours.</p></div></div><div class="card"><b>Think:</b> In “I have been studying for two hours,” what is more important: the result or the activity and duration?</div>${buttons(false)}`}
function choose(el){const q=data.choose[Math.floor(Math.random()*data.choose.length)];el.innerHTML=title('Choose the Meaning','Read the situation. Choose the meaning that best fits the context.')+`<div class="card"><p><b>Situation:</b> ${q.text}</p><h3>${q.q}</h3><div class="choice-grid">${q.opts.map((o,i)=>`<button class="choice" onclick="choice(this,${i},${q.ans},'${q.why.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="fb"></div></div>`}
function choice(btn,i,ans,why){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach((b,x)=>{if(x===ans)b.classList.add('correct')});const fb=document.getElementById('fb');if(i===ans){score+=10;fb.className='feedback good';fb.innerHTML='✅ <b>Correct!</b> '+why}else{btn.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='⚠️ <b>Almost there.</b> '+why}fb.innerHTML+=`<div class="actions"><span></span><button onclick="go(1)">Continue →</button></div>`;update()}
function build(el){const q=data.build[Math.floor(Math.random()*data.build.length)];el.innerHTML=title('Build the Sentence','Use the context to build a complete sentence. Focus on meaning and structure.')+`<div class="card"><p><b>Context:</b> ${q.context}</p><p>Choose the correct word order:</p><div class="choice-grid"><button class="choice" onclick="buildCheck(this,'${q.answer.replace(/'/g,"\\'")}',true)">${q.parts.join(' / ')}</button><button class="choice" onclick="buildCheck(this,'${q.answer.replace(/'/g,"\\'")}',false)">${q.parts.slice().reverse().join(' / ')}</button><button class="choice" onclick="buildCheck(this,'${q.answer.replace(/'/g,"\\'")}',false)">${q.parts.slice(0,2).concat(q.parts.slice(3),q.parts[2]).join(' / ')}</button></div><div id="fb"></div></div>`}
function buildCheck(btn,ans,correct){if(answered)return;answered=true;const fb=document.getElementById('fb');if(correct){score+=15;btn.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <b>Correct!</b> '+ans}else{btn.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='❌ <b>Try again.</b> Think about the order: have/has + been + V-ing for an ongoing activity, or have/has + V3 for a completed result.'}fb.innerHTML+=`<div class="actions"><span></span><button onclick="go(1)">Continue →</button></div>`;update()}
function speak(el){el.innerHTML=title('Speak in a Conversation','Choose the response that sounds natural in the conversation.')+`<div class="card"><div class="dialogue"><div class="bubble"><b>Alex:</b> You look tired. What have you been doing?</div><div class="bubble you"><b>Maya:</b> ____________________</div></div><div class="choice-grid"><button class="choice" onclick="speakCheck(this,true)">I have been studying for three hours.</button><button class="choice" onclick="speakCheck(this,false)">I have studied for three hours right now.</button><button class="choice" onclick="speakCheck(this,false)">I study for three hours.</button></div><div id="fb"></div></div>`}
function speakCheck(btn,correct){if(answered)return;answered=true;const fb=document.getElementById('fb');if(correct){score+=15;btn.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <b>Alex:</b> “Wow! Three hours? That’s a long time!”<br><span class="small">The question asks about an ongoing activity and its duration.</span>'}else{btn.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='❌ Think about Alex’s question: the activity and how long it has been happening.'}fb.innerHTML+=`<div class="actions"><span></span><button onclick="go(1)">Continue →</button></div>`;update()}
function complete(el){const q=data.complete[Math.floor(Math.random()*data.complete.length)];el.innerHTML=title('Complete the Conversation','Type the missing words. Pay attention to the time signal and context.')+`<div class="card"><div class="dialogue"><div class="bubble"><b>A:</b> ${q.a}</div><div class="bubble"><b>B:</b> ${q.b}</div></div><input class="answer" id="typed" placeholder="Type your answer here"><br><br><button onclick="typedCheck('${q.answer}','${q.why.replace(/'/g,"\\'")}')">Check answer</button><div id="fb"></div></div>`}
function typedCheck(ans,why){if(answered)return;answered=true;const val=document.getElementById('typed').value.trim().toLowerCase().replace(/\s+/g,' '),fb=document.getElementById('fb');if(val===ans){score+=20;fb.className='feedback good';fb.innerHTML='✅ <b>Correct!</b> “'+ans+'”<br>'+why}else{fb.className='feedback bad';fb.innerHTML='❌ <b>Not quite.</b><br>Your answer: “'+(val||'—')+'”<br>Correct answer: <b>'+ans+'</b><br>'+why}fb.innerHTML+=`<div class="actions"><span></span><button onclick="go(1)">Continue →</button></div>`;update()}
function check(el){el.innerHTML=title('Check Your Response','Now connect your answer to the grammar concept. The goal is to explain why the tense works.')+`<div class="card"><h3>Quick Challenge</h3><p><b>Look at Anna! Her hands are covered in flour.</b></p><div class="choice-grid"><button class="choice" onclick="finalCheck(this,false)">Anna has baked cookies.</button><button class="choice" onclick="finalCheck(this,true)">Anna has been baking cookies.</button><button class="choice" onclick="finalCheck(this,false)">Anna bakes cookies.</button></div><div id="fb"></div></div>`}
function finalCheck(btn,correct){if(answered)return;answered=true;const fb=document.getElementById('fb');if(correct){score+=20;btn.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <b>Good choice!</b> The visible evidence (flour on her hands) suggests a recent activity. Present Perfect Continuous highlights that activity.'}else{btn.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='❌ Look at the clue: we can see evidence of a recent activity. Present Perfect Continuous is a strong choice.'}fb.innerHTML+=`<div class="actions"><span></span><button onclick="go(1)">Reflect →</button></div>`;update()}
function reflect(el){el.innerHTML=title('Reflect','Think about the meaning, not only the formula. Write your own ideas.')+`<div class="card reflection"><label>1. When do we use Present Perfect Simple?</label><textarea placeholder="I think we use it when..."></textarea><label>2. When do we use Present Perfect Continuous?</label><textarea placeholder="I think we use it when..."></textarea><label>3. What is the difference between result and activity/duration?</label><textarea placeholder="The difference is..."></textarea><label>4. Which tense would you use for an experience you have had three times? Why?</label><textarea placeholder="I would use... because..."></textarea><label>5. Which tense would you use for an activity that started two hours ago and is still happening?</label><textarea placeholder="I would use... because..."></textarea><button onclick="finish()">Finish Quest 🎉</button></div>`}
function finish(){document.getElementById('app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">🎉</div><h2>Quest Complete!</h2><p class="score">Your score: ${score} points</p><p>Remember:</p><div class="grid"><div class="tense"><h3>Present Perfect Simple</h3><p><b>Result • Experience • Achievement</b></p><div class="formula">have / has + V3</div></div><div class="tense"><h3>Present Perfect Continuous</h3><p><b>Activity • Duration • Evidence</b></p><div class="formula">have / has + been + V-ing</div></div></div><p class="small">Your teacher can use your reflection answers for discussion or formative assessment.</p><button onclick="stage=0;score=0;render()">↻ Restart</button></div>`}
render();
</script>
</body>
</html>
